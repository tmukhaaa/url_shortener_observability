global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'url-shortener'
    static_configs:
      - targets: ['url-shortener:8082']  # Using service name in Docker network
    metrics_path: '/metrics'
    scheme: 'http'

  # Optional: Add node-exporter if you want system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
